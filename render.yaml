# Free presentation service. SQLite data on the free instance is temporary.
services:
  - type: web
    name: acremind-demo
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: APP_TIMEZONE
        value: Africa/Lusaka
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
